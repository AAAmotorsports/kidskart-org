<!-- GA4: gtag は redirect 前に必ずロード。cookie_domain=kidskart.org で
     .kidskart.org スコープの cookie を発行し、reserve.kidskart.org へ
     移動後もセッション継続 (旧: gtag 無し & location.replace 即発火
     → reserve 側で kidskart.org 自己参照カウントされていた) -->
<script src="https://www.googletagmanager.com/gtag/js?id=G-W3HB0DT0Y3"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('config', 'G-W3HB0DT0Y3', {
    cookie_domain: 'kidskart.org',
    cookie_flags: 'SameSite=None;Secure',
    send_page_view: true
  });
  setTimeout(function(){ location.replace('https://kidskart.org/'); }, 500);
</script>

</style>
