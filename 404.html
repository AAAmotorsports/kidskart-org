<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ページが見つかりませんでした — 福岡キッズカートアカデミー</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://kidskart.org/">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'M PLUS Rounded 1c','Zen Kaku Gothic New',-apple-system,sans-serif;
    background:linear-gradient(135deg,#eef7fc 0%,#cae7f7 100%);
    color:#163048;
    display:flex;align-items:center;justify-content:center;
    padding:2rem;line-height:1.7;
  }
  .card{
    max-width:560px;width:100%;
    background:#fff;border-radius:24px;
    padding:3rem 2rem;
    box-shadow:0 12px 40px rgba(58,169,232,.18);
    text-align:center;
  }
  .badge{
    display:inline-flex;align-items:center;justify-content:center;
    width:72px;height:72px;border-radius:50%;
    background:#3aa9e8;color:#fff;
    font-family:'Anton',sans-serif;font-size:1.6rem;
    margin-bottom:1.2rem;
    box-shadow:0 6px 18px rgba(58,169,232,.4);
  }
  h1{font-size:1.6rem;margin-bottom:.6rem;letter-spacing:.02em}
  .code{
    display:inline-block;
    font-family:'JetBrains Mono',monospace;
    color:#7d8fa0;font-size:.85rem;
    margin-bottom:1.4rem;letter-spacing:.1em;
  }
  p{color:#3d556f;margin-bottom:1.6rem}
  .links{display:flex;flex-direction:column;gap:.7rem;margin-top:1.4rem}
  .btn{
    display:block;text-decoration:none;
    padding:.9rem 1.4rem;border-radius:12px;
    font-weight:700;font-size:.95rem;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn-primary{background:#3aa9e8;color:#fff;box-shadow:0 4px 12px rgba(58,169,232,.35)}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(58,169,232,.45)}
  .btn-ghost{background:#f4f9fc;color:#163048;border:1.5px solid #d8e6f0}
  .btn-ghost:hover{background:#e8f1f8}
  .foot{margin-top:1.8rem;font-size:.78rem;color:#7d8fa0}
</style>
</head>
<body>
  <div class="card">
    <div class="badge">404</div>
    <h1>ページが見つかりませんでした</h1>
    <div class="code">PAGE NOT FOUND</div>
    <p>お探しのページは移動・削除された可能性があります。<br>下のリンクからトップページまたは記事一覧へお進みください。</p>
    <div class="links">
      <a class="btn btn-primary" href="/">🏠 トップページへ戻る</a>
      <a class="btn btn-ghost" href="/stories/">📖 記事アーカイブ（2013–2019）</a>
      <a class="btn btn-ghost" href="https://reserva.be/kidskart/reserve">🏎️ 体験会を予約する</a>
    </div>
    <div class="foot">福岡キッズカートアカデミー · FUKUOKA KIDS KART ACADEMY</div>
  </div>
</body>
</html>
