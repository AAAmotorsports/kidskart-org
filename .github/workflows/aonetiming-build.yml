name: AoneTiming (Windows exe)

on:
  workflow_dispatch:
  push:
    paths:
      - "aonetiming/**"
      - ".github/workflows/aonetiming-build.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: aonetiming
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m unittest discover -s tests
      - name: Build AoneTiming.exe
        run: pyinstaller --onefile --name AoneTiming --add-data "aonetiming/web;aonetiming/web" run_aonetiming.py
      - name: Build AoneTimingCapture.exe
        run: pyinstaller --onefile --name AoneTimingCapture run_capture.py
      - uses: actions/upload-artifact@v4
        with:
          name: AoneTiming-windows
          path: |
            aonetiming/dist/AoneTiming.exe
            aonetiming/dist/AoneTimingCapture.exe
