# ==============================================================================
# ASMS 1ヶ月後フォローアップメール送信 (手動実行専用)
# ------------------------------------------------------------------------------
# ★ 定期実行は 2026-08-29 に Cloudflare Workers Cron Triggers に移行済み。
# ★ このワークフローは緊急時の手動再送 (workflow_dispatch) 専用として残す。
#
# API 詳細: /api/cron/followup-mail (Cloudflare Worker 側で毎日 19:00 JST に
# Cloudflare Cron Trigger から自動発火)。詳細は asms/app/worker-entry.mjs 参照。
#
# 二重送信防止は API 側 (reservations.followup_email_sent_at) で担保。
# 保護者単位で「1 回だけ」の運用。
#
# 必要な GitHub Actions Secrets:
#   ASMS_API_BASE      - 例: https://reserve.kidskart.org
#   ASMS_CRON_SECRET   - Cloudflare Worker の CRON_SECRET と同じ値
#
# 手動実行: Actions タブから「Run workflow」で任意の日付を指定 (対象日 =
# 参加日) して再送可能。
# ==============================================================================

name: ASMS Followup Mail (manual)

on:
  workflow_dispatch:
    inputs:
      date:
        description: '対象日 (YYYY-MM-DD, 空欄なら 30 日前 JST)'
        required: false
        default: ''

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/cron/followup-mail
        env:
          ASMS_API_BASE: ${{ secrets.ASMS_API_BASE }}
          ASMS_CRON_SECRET: ${{ secrets.ASMS_CRON_SECRET }}
          DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          if [ -z "${ASMS_API_BASE:-}" ] || [ -z "${ASMS_CRON_SECRET:-}" ]; then
            echo "::error::ASMS_API_BASE / ASMS_CRON_SECRET の Secrets が必要です" >&2
            exit 1
          fi
          BASE="${ASMS_API_BASE%/}"
          URL="$BASE/api/cron/followup-mail"
          if [ -n "${DATE:-}" ]; then
            URL="$URL?date=$DATE"
          fi
          HTTP_CODE=$(curl -sS -X POST "$URL" \
            -H "x-cron-secret: $ASMS_CRON_SECRET" \
            -H "Content-Type: application/json" \
            -o response.json \
            -w "%{http_code}")
          echo "HTTP $HTTP_CODE"
          cat response.json
          echo
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Followup mail cron failed with HTTP $HTTP_CODE" >&2
            exit 1
          fi
